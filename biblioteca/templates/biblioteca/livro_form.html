{% extends "biblioteca/base.html" %}

{% block title %}Livro | Biblioteca{% endblock %}

{% block content %}
<section class="painel">
    <h1>{% if object %}Editar livro{% else %}Cadastrar livro{% endif %}</h1>
    <p>Informe os dados do livro e o autor responsável.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="botao" type="submit">Salvar</button>
        <a class="botao botao-secundario" href="{% url 'lista_livros' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
