{% extends "biblioteca/base.html" %}

{% block title %}Excluir livro | Biblioteca{% endblock %}

{% block content %}
<section class="painel">
    <h1>Excluir livro</h1>
    <p>Deseja realmente excluir <strong>{{ livro.titulo }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button class="botao botao-perigo" type="submit">Sim, excluir</button>
        <a class="botao botao-secundario" href="{% url 'lista_livros' %}">Cancelar</a>
    </form>
</section>
{% endblock %}
